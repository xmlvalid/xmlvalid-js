# Publishes @xmlvalid/sdk to npm, with provenance, when a vX.Y.Z tag is pushed.
#
# One-time setup, with Trusted Publishing (no token stored anywhere):
#   npmjs.com → @xmlvalid/sdk → Settings → Trusted Publisher → GitHub Actions:
#     Organization or user: xmlvalid    Repository: xmlvalid-js
#     Workflow filename: publish.yml    Environment: (empty)
# The package must exist first: publish 1.0.0 once by hand (npm publish, 2FA in the browser),
# then add the trusted publisher.
#
# Releasing: bump "version" in package.json, VERSION in src/client.ts and CHANGELOG.md, commit, then
#   git tag v1.0.1 && git push origin v1.0.1

name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: The tag matches the version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
          grep -q "VERSION = '$(node -p 'require("./package.json").version')'" src/client.ts
      - run: npm install --no-audit --no-fund
      - run: npm publish
